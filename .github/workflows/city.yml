name: build-city

# 都市を1つ選んで時刻表を作り直し、棚へ配る（手動専用）。
# 大阪・札幌・名古屋・東京のような「福岡以外の都市」はダイヤ改正の時にだけ
# 作り直せばよいので、毎月の自動更新(build.yml)には入れていない。
# 選ばなかった都市は carry_over.py が公開中の棚から回収するので消えない。
on:
  workflow_dispatch:
    inputs:
      city:
        description: 作り直す都市
        required: true
        type: choice
        options: [osaka, sapporo, nagoya, tokyo]

permissions:
  contents: read
  pages: write
  id-token: write

# build.yml / canary.yml の配信と競合させない（順番待ちにする）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 東京は約290駅ぶんをYahooから2秒間隔で取るため長時間かかる（既定6時間では
    # 足りない可能性があるので明示的に上限を伸ばす）。
    timeout-minutes: 350
    steps:
      # サプライチェーン対策: 公式actionをコミットSHAで固定（タグ付け替え攻撃を防ぐ）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 駅数が目安から外れたら build_city_subway.py 自身が非0で止まる
      # → 配信ジョブに進まず、棚は前回のまま温存される。
      - run: python build_city_subway.py ${{ inputs.city }}
      - run: python carry_over.py             # 他都市を棚から回収（消さないため）
      - run: python split_v2.py               # 索引＋駅ごとに小分け（v2）
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
