name: build-and-deploy

# 月1のフル取得（安全網）。カナリア(canary.yml)が主で、変化を検知した日だけ
# ここと同じフル取得を回す。カナリアが見逃しても、月1のこれが必ず正す（指示書D）。
# 月1（1日 JST5時 = UTC 前日20時）＋手動＋main push。ダイヤ改正は年数回なので低頻度で十分。
on:
  schedule:
    - cron: "0 20 1 * *"
  workflow_dispatch:
  push:
    branches: [main]

# 最小権限。Secrets・書き込みトークンは使わない（公式Excel取得とPages配信のみ）。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # サプライチェーン対策: 公式actionをコミットSHAで固定（タグ付け替え攻撃を防ぐ）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 取得崩れ時は各scriptが非0終了 → 配信ジョブに進まず前回分を温存
      - run: python build_subway.py           # 地下鉄（公式Excel）
      - run: python build_train.py            # JR/西鉄（Yahoo・2秒スロットル・~15分）
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
