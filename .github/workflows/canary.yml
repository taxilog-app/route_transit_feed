name: canary-timetable

# 毎日カナリア(代表10駅・約1分)を回し、公開中フィードと突き合わせて
# 「ダイヤ改正の疑い」を検知する（指示書D）。変化が無ければここで終わり
# （Yahooへは10駅ぶんだけ）。変化があった時だけ build_subway.py→build_train.py
# のフル取得(~15分)を回してPagesへ配信する。地下鉄(公式Excel)はカナリア対象外
# だが、配信するout/は両方まとまって出るので変化ありの日は必ず両方流す。
# 月1のフル取得(build.yml)は安全網として残す＝カナリアが見逃しても正される。
on:
  schedule:
    - cron: "0 20 * * *"  # 毎日 JST5:00 = UTC前日20:00（定期実行は数十分遅れることがある）
  workflow_dispatch:

# 最小権限。build.ymlと同じ（配信ジョブでのみpages/id-tokenを使う）。
permissions:
  contents: read
  pages: write
  id-token: write

# build.ymlの配信ジョブと競合しないよう同じグループにする。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.canary.outputs.changed }}
    steps:
      # サプライチェーン対策: 公式actionをコミットSHAで固定（タグ付け替え攻撃を防ぐ）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: canary
        run: |
          set +e
          python canary_timetable.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "変化なし → フル取得はスキップ"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 10 ]; then
            echo "変化あり → フル取得へ進む"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::カナリアの取得自体が失敗しました（壊れている）"
            exit "$code"
          fi

  build:
    needs: canary
    if: needs.canary.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 取得崩れ時は各scriptが非0終了 → 配信ジョブに進まず前回分を温存
      - run: python build_subway.py           # 地下鉄（公式Excel・片方だけ古くならないよう先に流す）
      - run: python build_train.py            # JR/西鉄（Yahoo・2秒スロットル・~15分）
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    if: needs.canary.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
