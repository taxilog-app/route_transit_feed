name: build-ferry

# 港の到着（福岡市営渡船・クルーズ客船・フェリー太古）を作り直して棚へ配る。
#
# 【なぜ電車と分けたか（社長指摘 2026-08-13）】
# 最初は build.yml の中で build_train.py の**後ろ**に置いた。これが誤り。
#   ・電車の取得は Yahoo! を70駅ぶん叩く 27分の重い処理で、崩れやすい
#   ・フェリーは福岡市オープンデータの17KBを取って変換するだけ＝**数秒・安定**
# 実際 2026-08-13、電車が NameError で落ちた巻き添えで、フェリーは
# **0秒＝一度も実行されないまま**終わった。
# 壊れやすい重い処理に、軽くて安定した処理を人質に取らせない。
#
# 【🔴 頻度＝週2回（2026-08-16 変更・元は月1）】
#   市営渡船のダイヤ改正は年数回なので月1で足りていた。
#   ところが**クルーズ客船を足したことで前提が変わった**。福岡市 旅客振興課から
#   利用許諾をもらった際、先方より明確な指摘があった:
#     「クルーズ船は直前での寄港時間変更や天候等の影響による寄港の中止・追加が
#       発生することもしばしばあり、数日に１回程度のペースで寄港予定のページを
#       更新することもございます。少なくとも週に１回以上の頻度でのデータ取得を
#       おすすめします」
#   月1のままだと**運転手に嘘の寄港時刻を出す**。月〜木の週2回にして余裕を持たせる。
#   ⚠️ ここで上げているのは**ハブ側の作り直しの頻度**。運転手の端末の通信量は
#      増えない（端末は既存の関所・キャッシュのまま）。
#   月・木 JST5:00 = UTC 日・水 20:00。build.yml(1日)・canary(毎日5:30)とずらす。
on:
  schedule:
    - cron: "0 20 * * 0,3"
  workflow_dispatch:

# 最小権限。city.yml と同じ（配信ジョブでのみ pages/id-token を使う）。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 走っている配信・他の取得を横取りして止めない（順番待ちにする）。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ports: ${{ steps.ports.outcome }}
    steps:
      # サプライチェーン対策: 公式actionをコミットSHAで固定（タグ付け替え攻撃を防ぐ）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # 🔴 取得を始める前に道具そのものを点検する（数秒）。
      - run: python check_scripts.py
      # フェリーを作る。崩れたら非0終了で配信に進まない＝棚は前回のまま。
      - run: python build_ferry.py
      # 港の到着（クルーズ客船・フェリー太古・九州郵船）。
      # 🔴 市営渡船とは別ファイル(port_arrivals.json)にしている。既存ファイルに
      #    項目を足すと古いアプリで配信が丸ごと止まるため（出力項目の完全一致検査）。
      # 🔴 ここで止めない（2026-10-05 社長指示「クルーズと壱岐対馬五島は別」）。
      #    以前はクルーズに乗り場未確認の便が1つ出ただけで全部止まり、壱岐対馬・
      #    五島まで1か月以上古いまま＝運転手の画面が空になった。
      #    道具は会社ごとに作り、崩れた会社は公開中の版を残す。全滅でも
      #    carry_over が公開中のファイルを回収する。要対応があれば最後の
      #    「要対応を赤にする」で記録を赤にする（配ったうえで気づかせる）。
      - id: ports
        continue-on-error: true
        run: python build_port_arrivals.py
      # 🔴 フェリー以外（電車・地下鉄・他都市）を公開中の棚から回収する。
      #    棚は「今回アップしたもので丸ごと置き換わる」ので、これを飛ばすと
      #    **フェリーだけの棚になって電車が全部消える**。
      - run: python carry_over.py
      - run: python split_v2.py               # 索引＋駅ごとに小分け（v2）
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
      # 配った後で、港の到着に要対応（外した便・作れなかった会社）があれば赤にする。
      - name: 要対応を赤にする
        if: needs.build.outputs.ports == 'failure'
        run: |
          echo "::error::港の到着に要対応があります。build ジョブの『build_port_arrivals.py』の記録を見てください（配信は済んでいます）"
          exit 1
